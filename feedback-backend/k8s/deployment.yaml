apiVersion: apps/v1
kind: Deployment
metadata:
  name: feedback-backend
  labels:
    app: feedback-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: feedback-backend
  template:
    metadata:
      labels:
        app: feedback-backend
    spec:
      containers:
      - name: feedback-backend
        image: kavyabarla/feedback-backend:latest
        imagePullPolicy: Never  # <-- ADD THIS LINE
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          value: "production"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: feedback-backend-service
spec:
  type: NodePort  # Use NodePort, not LoadBalancer
  selector:
    app: feedback-backend
  ports:
    - protocol: TCP
      port: 80         # Service port
      targetPort: 5000 # Container port
      nodePort: 30663  # NodePort for external access (choose port 30000-32767)
